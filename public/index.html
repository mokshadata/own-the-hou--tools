<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" type="image/ico" href="./favicon.ico" />
    <title>Solid App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">  </head>
  <body>
    <main class="container">
      <h1>DPA Tool</h1>
      <ownthehou-dpa-tool data-bs-theme="light"></ownthehou-dpa-tool>
      <h1>DTI Calculator</h1>
      <ownthehou-dti-calculator data-bs-theme="light"></ownthehou-dti-calculator>
      <h1>Loan Comparison</h1>
      <ownthehou-loan-estimate-comparison data-bs-theme="light"></ownthehou-loan-estimate-comparison>

    </main>
    <script src="./ownthehoutools--dpa-tool--web.es.js" type="module"></script>
    <script src="./ownthehoutools--dti-calculator--web.es.js" type="module"></script>
    <script src="./ownthehoutools--loan-estimate-comparison--web.es.js" type="module"></script>
  </body>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script>
    const KEYS = {
      'down-payment-percentage-target': { format: (strVal) => (strVal * 1), propKey: 'initial-down-payment-percentage-target' },
      'household-size': { format: (strVal) => (strVal * 1), propKey: 'initial-household-size' },
      'annual-income': { format: (strVal) => (strVal * 1), propKey: 'initial-household-income' },
      'house-listing-price': { format: (strVal) => (strVal * 1), propKey: 'initial-target-home-price' },
      'latlong': { format: (strVal) => (strVal.split(',').map((val) => (val * 1))), propKey: 'initial-coordinates' },
    }

    const possibleVariables = [...(new URLSearchParams(window.location.search)).entries()].map(([key, value]) => ([KEYS[key].propKey, KEYS[key].format(value)]))
    const toolWidget = document.querySelector('ownthehou-dpa-tool')

    possibleVariables.forEach(([key, val]) => {
      toolWidget.setAttribute(key, val)
    })

    </script>
</html>
